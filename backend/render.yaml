services:
  - type: web
    name: mtaa-assistant-backend
    env: docker
    plan: starter
    repo: https://github.com/0mar067/MTAA-ASSISTANT-FINDER
    branch: main
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mtaa-pg
          property: connectionString
databases:
  - name: mtaa-pg
    engine: postgres
    plan: starter
